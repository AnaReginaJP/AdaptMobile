[alembic]
# Ruta al directorio de migraciones (relativa al contenedor backend: /app/alembic)
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# La URL real la inyecta app/migrations.py desde settings.DATABASE_URL
sqlalchemy.url = postgresql+psycopg2://postgres:postgres_password@database:5432/adaptmobile
